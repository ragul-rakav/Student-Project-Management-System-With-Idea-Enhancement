<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Title -->
  <rect x="40" y="20" width="920" height="60" rx="10" fill="#1e293b" stroke="#334155" filter="url(#shadow)" />
  <text x="500" y="47" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">GAMIFIED CREDIT ECONOMY &amp; TIERED REPOSITORY ACCESS CONTROL</text>
  <text x="500" y="66" fill="#94a3b8" font-size="12" text-anchor="middle">Incentivizing Active Student Innovation • Anti-Free-Rider Gatekeeping • Institutional Leaderboard</text>

  <!-- Pyramid Tiers on Left -->
  <g transform="translate(40, 105)">
    <!-- TIER 3 (Apex): External Projects Tier -->
    <path d="M 120 20 L 360 20 L 400 120 L 80 120 Z" fill="url(#goldGrad)" opacity="0.9" />
    <text x="240" y="55" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">👑 TIER 3: EXTERNAL REPOSITORY</text>
    <text x="240" y="75" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">200 CREDITS + ≥ 3 APPROVED PROJECTS</text>
    <text x="240" y="95" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Unlocked: Hackathon-Winning &amp; Industry Archives</text>

    <!-- TIER 2: Internal Projects Tier -->
    <path d="M 75 130 L 405 130 L 445 240 L 35 240 Z" fill="url(#silverGrad)" opacity="0.9" />
    <text x="240" y="165" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">🥈 TIER 2: INTERNAL REPOSITORY</text>
    <text x="240" y="185" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">100 CREDITS + ≥ 3 APPROVED PROJECTS</text>
    <text x="240" y="205" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Unlocked: Full Academic Code, Reports &amp; Slides</text>

    <!-- TIER 1 (Base): Idea Showcase Tier -->
    <path d="M 30 250 L 450 250 L 480 370 L 0 370 Z" fill="url(#bronzeGrad)" opacity="0.9" />
    <text x="240" y="295" fill="#0f172a" font-size="14" font-weight="800" text-anchor="middle">🥉 TIER 1: IDEA SHOWCASE TIER</text>
    <text x="240" y="315" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">60 CREDITS THRESHOLD</text>
    <text x="240" y="335" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Unlocked: Concept Pitches, Problem Statements &amp; Early Concepts</text>

    <!-- Free Tier / Locked Base -->
    <rect x="0" y="380" width="480" height="70" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
    <text x="240" y="405" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">🔒 LOCKED BASE (0 – 59 CREDITS)</text>
    <text x="240" y="423" fill="#cbd5e1" font-size="10" text-anchor="middle">Access Restricted to Personal Profile &amp; Submission Drafts.</text>
    <text x="240" y="438" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Students must contribute innovations to unlock institutional repositories.</text>
  </g>

  <!-- Credit Earning Matrix on Right -->
  <g transform="translate(540, 105)">
    <rect x="0" y="0" width="420" height="470" rx="12" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    
    <text x="20" y="32" fill="#38bdf8" font-size="14" font-weight="700">CREDIT EARNING &amp; PENALTY RULES</text>
    <text x="20" y="48" fill="#94a3b8" font-size="11">Automated Credit Transaction Audit Ledger</text>
    <line x1="20" y1="58" x2="400" y2="58" stroke="#334155" />

    <!-- Rule 1: Internal Project -->
    <g transform="translate(20, 70)">
      <rect x="0" y="0" width="380" height="52" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
      <text x="15" y="24" fill="#34d399" font-size="13" font-weight="700">+25 CREDITS</text>
      <text x="120" y="24" fill="#f1f5f9" font-size="11" font-weight="600">Approved Internal Academic Project</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Awarded automatically upon faculty sign-off &amp; rubric approval.</text>
    </g>

    <!-- Rule 2: External Project -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="380" height="52" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
      <text x="15" y="24" fill="#34d399" font-size="13" font-weight="700">+20 CREDITS</text>
      <text x="120" y="24" fill="#f1f5f9" font-size="11" font-weight="600">Approved External / Hackathon Project</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Awarded after external verification and faculty mentor review.</text>
    </g>

    <!-- Rule 3: Published Idea -->
    <g transform="translate(20, 190)">
      <rect x="0" y="0" width="380" height="52" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
      <text x="15" y="24" fill="#34d399" font-size="13" font-weight="700">+10 CREDITS</text>
      <text x="120" y="24" fill="#f1f5f9" font-size="11" font-weight="600">Published Novel Idea Concept</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Awarded when originality score ≥ 60% and idea clears screening.</text>
    </g>

    <!-- Rule 4: Peer Enhancement -->
    <g transform="translate(20, 250)">
      <rect x="0" y="0" width="380" height="52" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
      <text x="15" y="24" fill="#34d399" font-size="13" font-weight="700">+10 CREDITS</text>
      <text x="120" y="24" fill="#f1f5f9" font-size="11" font-weight="600">Accepted Peer Enhancement / Fork</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Awarded when project author and faculty accept extension pull.</text>
    </g>

    <!-- Rule 5: Community Engagement -->
    <g transform="translate(20, 310)">
      <rect x="0" y="0" width="380" height="52" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="15" y="24" fill="#38bdf8" font-size="13" font-weight="700">+1 CREDIT</text>
      <text x="120" y="24" fill="#f1f5f9" font-size="11" font-weight="600">Per 10 Peer Upvotes / Likes</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Encourages high-impact, well-documented student projects.</text>
    </g>

    <!-- Rule 6: Malicious Abuse Penalty -->
    <g transform="translate(20, 370)">
      <rect x="0" y="0" width="380" height="52" rx="8" fill="#0f172a" stroke="#e11d48" stroke-width="1.5" />
      <text x="15" y="24" fill="#f43f5e" font-size="13" font-weight="700">−5 CREDITS</text>
      <text x="120" y="24" fill="#f43f5e" font-size="11" font-weight="600">Malicious / False Violation Report</text>
      <text x="15" y="40" fill="#94a3b8" font-size="10">Penalizes fraudulent or abusive reports upon faculty investigation.</text>
    </g>

    <text x="210" y="450" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">Every Credit Transaction is Persisted in User Audit Logs</text>
  </g>
</svg>
