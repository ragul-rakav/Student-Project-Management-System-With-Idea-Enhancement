services:
  - type: web
    name: student-project-management-system
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMBEDDING_PROVIDER
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: student-project-db
          property: connectionString

databases:
  - name: student-project-db
    plan: free
