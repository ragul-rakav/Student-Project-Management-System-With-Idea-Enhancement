services:
  - type: web
    name: student-project-management-system
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: node server/database/migrateAndSeed.js && node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMBEDDING_PROVIDER
        value: local
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_iCc2hfa0qTEM@ep-withered-frog-a11frqqr-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
